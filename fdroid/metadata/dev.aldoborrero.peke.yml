MaintainerNotes: |-
  MPV and the Media3 FFmpeg and AV1 decoders come from damontecres/wholphin-extensions, built from source by
  fdroid/build-extensions.sh in the app's repository: prebuild lays the srclibs out where the upstream scripts expect
  them (and fails if a srclib is at a different version than wholphin-extensions pins), build compiles them for the
  entry's ABI and copies the three AARs into app/libs/. See fdroid/README.md in the app's repository.

  versionCode is 10 * (number of v* tags) + ABI (1 armeabi-v7a, 2 arm64-v8a, 3 x86_64), passed to Gradle with
  peke.versionCode. peke.updateChecker=false turns off the in-app updater, which installs APKs from GitHub releases.

