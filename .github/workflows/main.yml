name: Development build

on:
  push:
    branches:
      - main
      - develop/*

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BRANCH_NAME: ${{ github.ref_name }}
  GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx12g -XX:MaxMetaspaceSize=1024m'"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # Need the tags to build
      - name: Setup
        uses: ./.github/actions/setup

      - name: Get version names
        run: |
          LATEST_TAG=$(git describe --tags --match 'v*' --abbrev=0 || echo v0.0.0)
          VERSION_NAME=$(git describe --tags --match 'v*' --long || echo v0.0.0)
          if [[ $BRANCH_NAME == "main" ]]; then
            TAG_NAME="develop"
          else
            TAG_NAME="${BRANCH_NAME/\//-}"
          fi

          {
            echo "LATEST_TAG=$LATEST_TAG"
            echo "VERSION_NAME=$VERSION_NAME"
            echo "TAG_NAME=$TAG_NAME"
          } >> "$GITHUB_ENV"
      - name: Build release app
        id: build
        env:
          KEY_ALIAS: "${{ secrets.KEY_ALIAS }}"
          KEY_PASSWORD: "${{ secrets.KEY_PASSWORD }}"
          KEY_STORE_PASSWORD: "${{ secrets.KEY_STORE_PASSWORD }}"
          SIGNING_KEY: "${{ secrets.SIGNING_KEY }}"
          # A classic PAT with read:packages; GITHUB_TOKEN is only a fallback, it may not read another owner's packages
          ORG_GRADLE_PROJECT_WholphinExtensionsUsername: "${{ secrets.EXTENSIONS_USERNAME || github.actor }}"
          ORG_GRADLE_PROJECT_WholphinExtensionsPassword: "${{ secrets.EXTENSIONS_PASSWORD || secrets.GITHUB_TOKEN }}"
        run: |
          ./gradlew clean assembleDebug
          ./gradlew assembleRelease

      - name: Verify signatures
        run: |
          echo "Verify APK signatures"
          find app/build/outputs/apk -name '*.apk'
          find app/build/outputs/apk -name '*.apk' -print0 | xargs -t -0 -n1 ${{env.ANDROID_SDK_ROOT}}/build-tools/${{ env.BUILD_TOOLS_VERSION }}/apksigner verify --verbose --print-certs
      - name: Copy APK to shorter names
        id: apks
        run: |
          find app/build/outputs/apk -name '*.apk' -print0 |
            while IFS= read -r -d '' line; do
              # Peke-release-0.2.9-62-g5c12e03-16-arm64-v8a.apk => Peke-release-arm64-v8a.apk
              short_name="$(echo "$line" | sed -E 's/-[0-9]+\.[0-9]+\.[0-9]+-[0-9]+-g[a-fA-F0-9]+-[0-9]+//')"
              echo "$line => $short_name"
              cp "$line" "$short_name"
            done
      - name: Checksums
        run: |
          echo "SHA256 checksums:"
          find app/build/outputs/apk -name '*.apk' -print0 | xargs -0 sha256sum
      - name: Upload mapping files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mapping
          path: |
            app/build/outputs/**/mapping.txt
          compression-level: 6
      - name: Delete ${{ env.TAG_NAME }} tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s globstar

          gh release delete "${{ env.TAG_NAME }}" --cleanup-tag -y || true


          # The backticks are Markdown; Actions fills in the env expressions before the shell runs.
          # shellcheck disable=SC2016
          echo '### `${{ env.BRANCH_NAME }}` development build

          This pre-release tracks the development build of Peke for Jellyfin from the `${{ env.BRANCH_NAME }}` unstable branch. Install it by sideloading; the in-app updater only follows stable releases.

          See https://github.com/aldoborrero/peke/releases/latest for the latest stable release.

          [See changes since `${{ env.LATEST_TAG }}`](https://github.com/aldoborrero/peke/compare/${{ env.LATEST_TAG }}...${{ env.TAG_NAME }})' > ci_release_note.txt


           gh release create "${{ env.TAG_NAME }}" \
            --latest=false --prerelease --title "${{ env.VERSION_NAME }}" --target "${{ env.BRANCH_NAME }}" -F ci_release_note.txt \
            app/build/outputs/apk/**/*.apk
